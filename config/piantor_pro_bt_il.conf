# Mouse / pointing emulation (NAV layer uses &mkp, &mmv, &msc).
CONFIG_ZMK_POINTING=y

# RGB underglow disabled to save ~20 KB flash / ~3 KB RAM.
CONFIG_ZMK_RGB_UNDERGLOW=n

# Let the central (left) fetch the peripheral (right) battery level over the
# split link, so the &bapp behavior can type out the right half's charge.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
