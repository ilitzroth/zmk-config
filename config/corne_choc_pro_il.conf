# Mouse / pointing emulation (NAV layer uses &mkp, &mmv, &msc).
CONFIG_ZMK_POINTING=y

# Combos: il keymap uses 12 combos with up to 3 keys.
CONFIG_ZMK_COMBO_MAX_COMBOS_PER_KEY=5
CONFIG_ZMK_COMBO_MAX_KEYS_PER_COMBO=3

# RGB underglow toggle (QK_UNDERGLOW_TOGGLE -> &rgb_ug RGB_TOG on NAV).
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
