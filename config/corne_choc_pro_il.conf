# Mouse / pointing emulation (NAV layer uses &mkp, &mmv, &msc).
CONFIG_ZMK_POINTING=y

# Smoothing knobs roughly mirror QMK MOUSEKEY_MOVE_DELTA / MK_COMBINED.
CONFIG_ZMK_POINTING_DEFAULT_MOVE_VAL=600
CONFIG_ZMK_POINTING_DEFAULT_SCRL_VAL=10

# Combos: il keymap uses 12 combos with up to 3 keys.
CONFIG_ZMK_COMBO_MAX_COMBOS_PER_KEY=5
CONFIG_ZMK_COMBO_MAX_KEYS_PER_COMBO=3

# RGB underglow toggle (QK_UNDERGLOW_TOGGLE -> &rgb_ug RGB_TOG on NAV).
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
